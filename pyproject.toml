[project]
name = "aifnipd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KivalM", email = "kivalm@protonmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "axelrod>=4.14.0",
    "gcloud>=0.18.3",
    "ipykernel>=6.30.1",
    "jax>=0.7.0",
    "seaborn>=0.13.2",
    "inferactively-pymdp",
    "wandb>=0.21.1",
    "matplot2tikz>=0.4.1",
    "webcolors>1.13",
    "scienceplots>=2.1.1",
]

[project.optional-dependencies]
xpu = [
    "torch",
    "torchvision", 
    "torchaudio",
]

[project.scripts]
genplots = "experiments.cli:main"


[tool.uv.sources]
inferactively-pymdp = { git = "https://github.com/kivalm/pymdp", branch = "master" }

[tool.uv]
extra-index-url = [
    "https://download.pytorch.org/whl/xpu"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
